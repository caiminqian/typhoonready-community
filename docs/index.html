<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区防台小助手 · TyphoonReady Community（静态演示）</title>
<style>
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; background: #f5f7fa; color: #222;}
h1 { font-size: 22px;}
.card { background: #fff; border-radius: 10px; padding: 18px; margin: 14px 0; box-shadow: 0 1px 4px rgba(0,0,0,.08);}
.badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-weight: bold; color: #fff;}
.lv-高 { background: #e67e22;}.lv-中 { background: #d4a017;}.lv-低 { background: #27ae60;}.lv-极高 { background: #c0392b;}
select, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #ccc;}
select { width: 60%;} button { background: #1a73e8; color: #fff; border: none; cursor: pointer;}
.factor { margin: 6px 0;}.timeline h3 { margin: 12px 0 6px;} li { margin: 4px 0;}
.hint { color: #666; font-size: 13px;}
.note { background: #fff8e1; border-left: 4px solid #f0ad4e; padding: 10px 14px; border-radius: 6px; margin: 14px 0; font-size: 14px;}
</style>
</head>
<body>
<h1>🌪️ 社区防台小助手 <span class="hint">TyphoonReady Community · AI4Climate Track05</span></h1>
<div class="note">🤖 AI 演示版：以下为 <b>台风贝碧嘉（2024）真实路径复盘</b> 的评估结果（IBTrACS 最佳路径 + ERA5 降雨再分析），行动指引由大模型生成。完整可运行版本（含实时数据）见 <a href="https://github.com/caiminqian/typhoonready-community">GitHub 仓库</a>。</div>
<div class="card">
<p class="hint">选择示例小区，查看复盘评估结果：</p>
<select id="sel"></select>
<button onclick="render()">生成评估</button>
</div>
<div id="result"></div>
<script>
let DATA = {};
fetch('results.json').then(r => r.json()).then(d => {
DATA = d;
const sel = document.getElementById('sel');
Object.keys(d).forEach(k => {
const o = document.createElement('option');
o.value = k; o.textContent = d[k].name; sel.appendChild(o);
});
render();
});
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(){
const k = document.getElementById('sel').value;
const d = DATA[k]; if(!d) return;
const risk = d.risk, g = d.guidance;
let html = '<div class="card"><h2>' + esc(d.name) + '</h2>'
+ '<p>综合风险：<b>' + risk.score + ' 分</b> <span class="badge lv-' + risk.level + '">' + risk.level + '风险</span></p>'
+ '<p class="hint">复盘案例：台风贝碧嘉（2024）· 数据来源：台风(' + d.data_sources.typhoon + ') / 降雨(' + d.data_sources.rainfall + ')</p>';
risk.factors.forEach(f => { html += '<div class="factor">· ' + esc(f.name) + '：<b>' + f.score + '/' + f.max + '</b> —— ' + esc(f.reason) + '</div>';});
html += '</div><div class="card timeline"><h2>居民行动指引</h2><p class="hint">' + esc(g.header) + '</p>';
if (g.mode === 'llm' && g.text) {
  html += '<div style="white-space:pre-wrap;line-height:1.7">' + esc(g.text) + '</div>';
} else {
  const names = {'72h': '未来72小时', '24h': '未来24小时', '6h': '未来6小时'};
  ['72h','24h','6h'].forEach(k2 => {
    html += '<h3>【' + names[k2] + '】</h3><ol>' + g.timelines[k2].map(t => '<li>' + esc(t) + '</li>').join('') + '</ol>';
  });
}
document.getElementById('result').innerHTML = html + '</div>';
}
</script>
</body>
</html>
