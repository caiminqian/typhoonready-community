<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区防台小助手 · AI4Climate Track05</title>
<link rel="stylesheet" href="/static/leaflet.css">
<script src="/static/leaflet.js"></script>
<style>
* { box-sizing: border-box;}
body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
margin: 0; background: #eef2f7; color: #1f2a3a;}
.hero { background: linear-gradient(135deg, #0f2a4a 0%, #1a5c9e 60%, #2a86d4 100%);
color: #fff; padding: 34px 20px 28px; text-align: center;}
.hero h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 1px;}
.hero p { margin: 0; font-size: 13px; opacity:.82;}
.wrap { max-width: 720px; margin: -18px auto 40px; padding: 0 14px;}
.card { background: #fff; border-radius: 14px; padding: 20px; margin: 14px 0;
box-shadow: 0 2px 12px rgba(15,42,74,.08);}
.search-row { display: flex; gap: 10px;}
input { flex: 1; font-size: 16px; padding: 12px 14px; border-radius: 10px;
border: 1.5px solid #d5dde8; outline: none; min-width: 0;}
input:focus { border-color: #2a86d4;}
button.go { font-size: 16px; padding: 12px 22px; border-radius: 10px; border: none;
background: #1a73e8; color: #fff; cursor: pointer; font-weight: 600; white-space: nowrap;}
button.go:disabled { background: #9db4cc; cursor: default;}
.chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;}
.chip { font-size: 13px; padding: 6px 12px; border-radius: 20px; background: #eaf1fa;
color: #1a5c9e; border: none; cursor: pointer;}
.chip:hover { background: #d6e6f8;}
.hint { color: #7a8799; font-size: 13px;}
/* 仪表盘 */
.gauge-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap;}
.gauge { position: relative; width: 150px; height: 150px; flex-shrink: 0;}
.gauge svg { transform: rotate(-90deg);}
.gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column;
align-items: center; justify-content: center;}
.gauge .num b { font-size: 38px; line-height: 1;}
.gauge .num span { font-size: 12px; color: #7a8799; margin-top: 4px;}
.badge { display: inline-block; padding: 5px 16px; border-radius: 20px; font-weight: bold;
font-size: 15px; color: #fff;}
.level-极高 { background: #c0392b;}.level-高 { background: #e67e22;}
.level-中 { background: #d4a017;}.level-低 { background: #27ae60;}
.c-极高 { color: #c0392b;}.c-高 { color: #e67e22;}.c-中 { color: #b8860b;}.c-低 { color: #27ae60;}
/* 因子条 */
.factor { margin: 12px 0;}
.factor.row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px;}
.bar { height: 10px; border-radius: 6px; background: #edf1f6; overflow: hidden;}
.bar i { display: block; height: 100%; border-radius: 6px;
background: linear-gradient(90deg, #2a86d4, #1a5c9e);
transition: width 1s cubic-bezier(.22,.8,.3,1); width: 0;}
.factor.why { font-size: 12.5px; color: #7a8799; margin-top: 4px;}
.src { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;}
.pill { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #eef4fb; color: #47617e;}
.pill.live { background: #e6f7ec; color: #1c7a3d;}
.pill.mock { background: #fdf3e3; color: #a86a12;}
.pill.link { text-decoration: underline; cursor: pointer;}
.timeline h3 { margin: 16px 0 8px; font-size: 16px;}
.timeline li { margin: 6px 0; font-size: 14.5px; line-height: 1.65;}
.timeline p.gtext { font-size: 14.5px; line-height: 1.8; }
.md-h { font-size: 16px; font-weight: 800; margin: 14px 0 8px; color: #1a3a5c; }
.md-p { font-size: 14.5px; line-height: 1.8; margin: 8px 0; color: #333; }
.md-ul { margin: 8px 0; padding-left: 22px; }
.md-ul li { margin: 6px 0; font-size: 14.5px; line-height: 1.7; color: #333; }
.md-hr { border: none; border-top: 1px solid #e6ecf3; margin: 14px 0; }
.gtext { background: #fbfcfe; border: 1px solid #e6ecf3; border-radius: 12px; padding: 6px 18px 12px; margin: 12px 0; }
/* 等待 */
.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #dfe6f0;
border-top-color: #1a73e8; border-radius: 50%; animation: spin.9s linear infinite;
vertical-align: -4px; margin-right: 10px;}
@keyframes spin { to { transform: rotate(360deg);}}
.elapsed { color: #1a73e8; font-weight: bold;}
.stage { font-size: 15px; font-weight: 500;}
.map { height: 320px; border-radius: 10px; margin-top: 14px; z-index: 0; }
.map-legend { font-size: 12px; color: #7a8799; margin-top: 6px; }
.map-legend i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.tl { border-radius: 12px; margin: 12px 0; overflow: hidden; padding: 4px 0 6px; }
.tl-72 { background: #e8f0fe; }
.tl-24 { background: #fff3e0; }
.tl-6 { background: #fce8e8; }
.tl-head { padding: 10px 16px 2px; font-weight: 800; font-size: 15px; }
.tl-72 .tl-head { color: #1a73e8; }
.tl-24 .tl-head { color: #c77800; }
.tl-6 .tl-head { color: #d93025; }

.tl-list { margin: 0; padding: 6px 16px 10px 16px; list-style: none; }
.tl-list li { margin: 9px 0; font-size: 14.5px; line-height: 1.65; padding-left: 30px; position: relative; color: #333; }
.tl-list li::before { content: attr(data-n); position: absolute; left: 0; top: 1px;
  width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; }
.tl-72 .tl-list li::before { background: #1a73e8; }
.tl-24 .tl-list li::before { background: #e69500; }
.tl-6 .tl-list li::before { background: #d93025; }
.tl-summary { background: #eef4fb; border-left: 4px solid #2a86d4; padding: 10px 14px; font-size: 14px; border-radius: 0 8px 8px 0; margin: 4px 0 6px; line-height: 1.7; }
.uq { background: #f4f7fb; border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 13.5px; color: #4a5a6e; line-height: 1.7; }
.uq b { color: #1a73e8; }
.topact { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border: 2px solid #f0ad4e; border-radius: 12px; padding: 16px; margin: 4px 0 14px; }
.topact .ta-head { font-size: 13px; color: #b26a00; font-weight: 700; margin-bottom: 6px; }
.topact .ta-text { font-size: 19px; font-weight: 800; color: #7a4a00; line-height: 1.5; margin-top: 10px; }
.topact .ta-text:first-of-type { margin-top: 0; }
.topact .ta-reason { font-size: 13px; color: #8a6d3b; margin-top: 6px; }
.speak-btn { background: #f0ad4e; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.speak-btn:disabled { background: #ccc; cursor: wait; }
.shelter { background: #e8f5e9; border-radius: 8px; padding: 12px 14px; margin: 10px 0; font-size: 14px; color: #2e5a32; line-height: 1.7; }
.shelter b { color: #1b7a3d; }
.shelter-btn { display: inline-block; background: #1b7a3d; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 700; text-decoration: none; margin: 6px 8px 0 0; }
@media (max-width: 480px) {
.hero h1 { font-size: 21px;}
.search-row { flex-direction: column;}
button.go { width: 100%;}
.gauge-wrap { justify-content: center; text-align: center;}
}
</style>
</head>
<body>
<div class="hero">
<h1>🌀 社区防台小助手</h1>
<p>台风路径 · 降雨预报 · 内涝风险 — 融合成一份居民行动清单 &nbsp;|&nbsp; AI4Climate Track05</p>
</div>
<div class="wrap">
<div class="card">
<div class="search-row">
<input id="addr" placeholder="输入任意地址，如：深圳南山区" value="繁裕小区" onkeydown="if(event.key==='Enter')assess('live')">
<button class="go" id="go" onclick="assess('live')">生成评估</button>
</div>
<div class="chips">
<button class="chip" onclick="fill('繁裕小区')">📍 繁裕小区</button>
<button class="chip" onclick="fill('深圳南山区')">📍 深圳南山</button>
<button class="chip" onclick="fill('上海陆家嘴')">📍 上海陆家嘴</button>
<button class="chip" onclick="fill('广州市天河区')">📍 广州天河</button>
      <button class="chip" onclick="assess('replay')">📊 贝碧嘉 2024 复盘</button>
</div>
</div>
<div id="result"></div>
</div>
<script>
function fill(v) { document.getElementById('addr').value = v; assess('live'); }

const LEVEL_COLOR = {'极高':'#c0392b','高':'#e67e22','中':'#d4a017','低':'#27ae60'};

function gaugeSVG(score, level) {
const c = LEVEL_COLOR[level] || '#27ae60';
const r = 62, circ = 2 * Math.PI * r;
const frac = Math.min(score, 100) / 100;
return '<div class="gauge"><svg width="150" height="150">'
+ '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="#edf1f6" stroke-width="14"/>'
+ '<circle id="gaugeArc" cx="75" cy="75" r="' + r + '" fill="none" stroke="' + c + '" stroke-width="14"'
+ ' stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + circ.toFixed(1) + '"/>'
+ '</svg><div class="num"><b class="c-' + level + '">' + score + '</b><span>综合风险 / 100</span></div></div>'
}

function speakTop() {
  const btn = document.getElementById('speakBtn');
  if (!window._lastResult || !btn || btn.disabled) return;
  const r = window._lastResult;
  const tas = (r.guidance && r.guidance.top_actions) || [];
  const nums = ['一','二','三'];
  let text = '社区防台小助手播报。' + r.community.name + '当前风险等级' + r.risk.level + '，' + Math.round(r.risk.score) + '分。';
  if (tas.length === 1) text += '今晚最重要的一件事：' + tas[0].text + '。';
  else if (tas.length > 1) {
    text += '今晚最重要的' + tas.length + '件事：';
    tas.slice(0, 3).forEach((a, i) => { text += '第' + nums[i] + '，' + a.text + '；'; });
  }
  btn.disabled = true; btn.textContent = '🔊 合成中…';
  fetch('/api/speak', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})})
    .then(x => x.json()).then(j => {
      if (j.audio_url) {
        const au = new Audio(j.audio_url); au.playbackRate = 0.95;
        const done = () => { btn.disabled = false; btn.textContent = '🔊 语音播报'; };
        au.onended = done;
        au.onerror = () => { done(); alert('播放失败'); };
        au.play(); btn.textContent = '🔊 播放中…';
      } else { alert(j.error || '合成失败'); btn.disabled = false; btn.textContent = '🔊 语音播报'; }
    }).catch(() => { alert('网络错误'); btn.disabled = false; btn.textContent = '🔊 语音播报'; });
}

async function assess(mode) {
const btn = document.getElementById('go'), box = document.getElementById('result');
mode = mode || 'live';
const addr = mode === 'replay' ? '贝碧嘉 2024 复盘' : document.getElementById('addr').value.trim();
if (!addr) { box.innerHTML = '<div class="card">⚠️ 请先输入地址</div>'; return;}
btn.disabled = true;
const t0 = Date.now();
const stages = ['📍 定位地址…', '🌀 获取台风实况与预报路径…', '🌧️ 获取降雨预报…', '🤖 AI 生成行动指引…'];
box.innerHTML = '<div class="card"><span class="spinner"></span><span class="stage" id="stage">' + stages[0] + '</span>'
+ ' <span class="hint">已等待 <span class="elapsed" id="elapsed">0</span> 秒</span></div>';
const timer = setInterval(() => {
const s = Math.floor((Date.now() - t0) / 1000);
const e = document.getElementById('elapsed'); if (e) e.textContent = s;
const st = document.getElementById('stage');
if (st) st.textContent = stages[Math.min(Math.floor(s / 8), stages.length - 1)];
}, 500);
try {
const r = await fetch('/api/assess', {
method: 'POST', headers: {'Content-Type': 'application/json'},
body: JSON.stringify({address: addr, mode: mode})
});
const d = await r.json();
window._lastResult = d;
clearInterval(timer);
if (!r.ok) {
box.innerHTML = '<div class="card">' + (r.status === 429? '⏳ ': '❌ ') + esc(d.error) + '</div>';
btn.disabled = false; return;
}
const risk = d.risk, g = d.guidance;
const _srcLinks = {'台风': 'https://typhoon.nmc.cn/web.html', '降雨': 'https://open-meteo.com/'};
const srcPill = (k, v) => {
  const cls = v === 'live' ? 'live' : (v === 'mock' ? 'mock' : '');
  const url = _srcLinks[k];
  const title = k === '地形' ? ' title="静态底图：等级/高程/历史涝点，无公开实时接口"' : '';
  const body = k + '：' + v;
  if (url) return '<a class="pill ' + cls + ' link" href="' + url + '" target="_blank" rel="noopener noreferrer">' + body + '</a>';
  return '<span class="pill ' + cls + '"' + title + '>' + body + '</span>';
};
let html = '<div class="card"><h2 style="margin:0 0 12px">' + esc(d.community.name) + '</h2>'
+ '<div class="gauge-wrap">' + gaugeSVG(risk.score, risk.level)
+ '<div><span class="badge level-' + risk.level + '">' + risk.level + '风险</span>'
+ '<p class="hint" style="margin:10px 0 0">当前台风：' + esc(risk.typhoon_name) + '</p></div></div>';
risk.factors.forEach(f => {
const pct = Math.round(f.score / f.max * 100);
html += '<div class="factor"><div class="row"><span>' + esc(f.name) + '</span>'
+ '<b>' + f.score + ' / ' + f.max + '</b></div>'
+ '<div class="bar"><i data-w="' + pct + '"></i></div>'
+ '<div class="why">' + esc(f.reason) + '</div></div>';
});
    if (d.risk.uncertainty) {
      const u = d.risk.uncertainty;
      const pl = u.p_level;
      html += '<div class="uq">🎲 <b>不确定性量化</b>（蒙特卡洛 ' + u.n + ' 次，含输入与权重扰动）<br>'
        + '分数区间：' + u.score_p10 + '–' + u.score_p90 + ' 分（±' + u.score_std + '）<br>'
        + '等级概率：低 ' + (pl['低']*100).toFixed(0) + '% · 中 ' + (pl['中']*100).toFixed(0)
        + '% · 高 ' + (pl['高']*100).toFixed(0) + '% · 极高 ' + (pl['极高']*100).toFixed(0) + '%<br>'
        + 'P(高及以上) = <b>' + (u.p_high_plus*100).toFixed(0) + '%</b></div>';
    }
html += '<div class="src">' + srcPill('台风', d.data_sources.typhoon)
+ srcPill('降雨', d.data_sources.rainfall) + srcPill('地形', d.data_sources.terrain) + '</div>';
    if (d.track && d.track.points && d.track.points.length) {
      html += '<div id="map" class="map"></div><div class="map-legend" id="mapLegend"></div>';
    }
    html += '</div>';
html += '<div class="card timeline"><h2 style="margin-top:0">📋 居民行动指引</h2><p class="hint">' + esc(g.header) + '</p>';
    if (g.top_actions && g.top_actions.length) {
      const taTitle = g.top_actions.length > 1 ? '⭐ 今晚最重要的几件事' : '⭐ 今晚最重要的一件事';
      html += '<div class="topact"><div class="ta-head">' + taTitle + '</div>'
        + g.top_actions.map(a => '<div class="ta-text">' + esc(a.icon) + ' ' + esc(a.text) + '</div>'
          + '<div class="ta-reason">' + esc(a.reason) + '</div>').join('')
        + '<button class="speak-btn" id="speakBtn" onclick="speakTop()">🔊 语音播报</button></div>';
    {
      const shelterTip = risk.level === '低'
        ? '🛟 <b>避险指引</b>：未雨绸缪，提前记下附近避难场所和停车场<br>'
        : '🛟 <b>避险指引</b>：暴雨内涝时，人员往高处走、车往高处停<br>';
      html += '<div class="shelter">' + shelterTip
        + '<a class="shelter-btn" target="_blank" href="' + amapSearch('应急避难场所', d.community.lat, d.community.lon) + '">📍 找附近避难场所</a>'
        + '<a class="shelter-btn" target="_blank" href="' + amapSearch('停车场', d.community.lat, d.community.lon) + '">🅿️ 找高处停车场</a>'
        + '<div class="hint">跳转高德地图，按距离排序，选地势高的去</div></div>';
    }
    }
if (g.mode === 'llm') { html += '<div class="gtext">' + md(g.text) + '</div>';}
    else {
      const names = {'72h': ['未来72小时 · 提前准备', 'tl-72'], '24h': ['未来24小时 · 加固防范', 'tl-24'], '6h': ['未来6小时 · 紧急避险', 'tl-6']};
      if (g.summary) { html += '<div class="tl-summary">📌 ' + esc(g.summary) + '</div>'; }
      for (const k of ['72h','24h','6h']) {
        html += '<div class="tl ' + names[k][1] + '"><div class="tl-head">' + names[k][0] + '</div>'
          + '<ol class="tl-list">' + g.timelines[k].map((t, i) => '<li data-n="' + (i+1) + '">' + esc(t) + '</li>').join('') + '</ol></div>';
      }
    }
const used = ((Date.now() - t0) / 1000).toFixed(1);
box.innerHTML = html + '<p class="hint">本次评估用时 ' + used + ' 秒</p></div>';
    if (d.track && d.track.points && d.track.points.length && window.L) { drawMap(d.track); }
requestAnimationFrame(() => requestAnimationFrame(() => {
document.querySelectorAll('.bar i').forEach(el => { el.style.width = el.dataset.w + '%';});
const arc = document.getElementById('gaugeArc');
if (arc) {
const circ = 2 * Math.PI * 62;
arc.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.22,.8,.3,1)';
arc.style.strokeDashoffset = (circ * (1 - Math.min(risk.score, 100) / 100)).toFixed(1);
}
}));
} catch (e) {
clearInterval(timer);
box.innerHTML = '<div class="card">❌ 请求失败：' + esc(String(e)) + '</div>';
}
btn.disabled = false;
}
function drawMap(track) {
  const pts = track.points, com = track.community;
  const map = L.map('map', {scrollWheelZoom: false}).setView([com.lat, com.lon], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom: 18, attribution: '&copy; OpenStreetMap'}).addTo(map);
  const obs = pts.filter(p => p.kind !== 'forecast').map(p => [p.lat, p.lon]);
  const fc = pts.filter(p => p.kind === 'forecast').map(p => [p.lat, p.lon]);
  const bounds = [];
  if (obs.length > 1) { L.polyline(obs, {color: '#e74c3c', weight: 3}).addTo(map); bounds.push(...obs); }
  else if (obs.length === 1) { L.circleMarker(obs[0], {radius: 5, color: '#e74c3c'}).addTo(map); bounds.push(...obs); }
  if (fc.length > 1) {
    const joint = obs.length ? [obs[obs.length - 1], ...fc] : fc;
    L.polyline(joint, {color: '#2980b9', weight: 3, dashArray: '8 6'}).addTo(map); bounds.push(...fc);
  }
  L.circleMarker([com.lat, com.lon], {radius: 8, color: '#ffffff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1}).addTo(map).bindPopup('📍 评估小区').openPopup();
  bounds.push([com.lat, com.lon]);
  map.fitBounds(bounds, {padding: [30, 30]});
  map.on('click', () => map.scrollWheelZoom.enable());
}
  const lg = document.getElementById('mapLegend');
  if (lg) {
    lg.innerHTML = '<i style="background:#e74c3c"></i>实况路径 '
      + (fc.length > 1 ? '<i style="background:#2980b9"></i>官方预报路径 ' : '')
      + '🔵 评估小区';
  }
function amapSearch(keyword, lat, lon) {
  return 'https://uri.amap.com/search?keyword=' + encodeURIComponent(keyword)
    + '&center=' + lon.toFixed(4) + ',' + lat.toFixed(4) + '&radius=3000';
}
function md(t) {
  // 先转义，再解析行内 markdown 子集
  const lines = esc(t).split('\n');
  let html = '', inList = false;
  for (let ln of lines) {
    let l = ln.trim();
    if (/^---+$/.test(l)) { if (inList) { html += '</ul>'; inList = false; } html += '<hr class="md-hr">'; continue; }
    let m4 = l.match(/^####\s+(.*)/); if (m4) { if (inList) { html += '</ul>'; inList = false; } html += '<h4 class="md-h">' + inlineMd(m4[1]) + '</h4>'; continue; }
    let m3 = l.match(/^###\s+(.*)/); if (m3) { if (inList) { html += '</ul>'; inList = false; } html += '<h3 class="md-h">' + inlineMd(m3[1]) + '</h3>'; continue; }
    let m2 = l.match(/^##\s+(.*)/); if (m2) { if (inList) { html += '</ul>'; inList = false; } html += '<h2 class="md-h">' + inlineMd(m2[1]) + '</h2>'; continue; }
    let ml = l.match(/^[-*•]\s+(.*)/); if (ml) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += '<li>' + inlineMd(ml[1]) + '</li>'; continue; }
    let mo = l.match(/^(\d+)[.、]\s+(.*)/); if (mo) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += '<li>' + inlineMd(mo[2]) + '</li>'; continue; }
    if (l === '') { if (inList) { html += '</ul>'; inList = false; } continue; }
    if (inList) { html += '</ul>'; inList = false; }
    html += '<p class="md-p">' + inlineMd(l) + '</p>';
  }
  if (inList) html += '</ul>';
  return html;
}
function inlineMd(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
